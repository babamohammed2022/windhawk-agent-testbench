name: ci
on: [push, pull_request]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: setup (wine, mingw, xvfb, minhook)
        run: ./setup.sh
      - name: acceptance suite
        run: bash tests/run_tests.sh
      - name: conformance table
        run: python3 -m awt.conformance
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awt-report
          path: .sandbox/report.json

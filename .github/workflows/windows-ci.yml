name: windows-ci

# Feature 2's CI backend: compile and run a mod in a NATIVE Windows process and
# publish the report (and a screenshot) as artifacts.
#
# Read this before trusting a green check:
#
# * `windows-latest` is **Windows Server** (build 20348). Its shell is not the
#   client Windows shell, so shell-related outcomes are marked *indicative* in
#   `verdict.indicative` and in the step summary - never "verified".
# * The mod is loaded by this bench's shim host, not by the Windhawk engine, so
#   internal symbol hooks stay `not_verifiable_here` even here.
# * A mod that fails to build or run does NOT fail this job: the verdict lives in
#   the artifact, and the job only fails if the harness itself breaks. That is
#   deliberate - "the mod crashed" is a result, not an infrastructure error.
#
# Diagnosis policy: this job once failed with "no files were found with the
# provided path" and nothing else readable - the report had not been produced at
# all, and the logs were not reachable. So every step now (a) appends a marker to
# `.sandbox/steps.log`, (b) publishes its outcome as a workflow ANNOTATION, which
# is readable through the check-runs API after the logs expire, and (c) keeps
# going on error so the markers show exactly where it stopped. The final step
# fails the job only for harness breakage.

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "Mod source to build and run (path in the repository)"
        required: false
        default: "examples/hello-log.wh.cpp"
      seconds:
        description: "How long the mod stays loaded"
        required: false
        default: "6"
      screenshot:
        description: "Capture the desktop after the run"
        required: false
        default: "true"
  pull_request:
    paths:
      - "awt/**"
      - "shim/**"
      - "host/**"
      - "targets/**"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/windows-ci.yml"
  push:
    branches: [main]
    paths:
      - "awt/**"
      - "shim/**"
      - "host/**"
      - ".github/workflows/windows-ci.yml"

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: start a diagnosis log
        shell: pwsh
        run: |
          $ErrorActionPreference = "continue"
          New-Item -ItemType Directory -Force -Path .sandbox/logs | Out-Null
          $os = (Get-CimInstance Win32_OperatingSystem)
          @(
            "run: $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT",
            "sha: $env:GITHUB_SHA",
            "os: $($os.Caption) build $($os.BuildNumber) productType $($os.ProductType)",
            "python: $(python -V 2>&1)",
            "cwd: $(Get-Location)"
          ) | Out-File -FilePath .sandbox/steps.log -Encoding utf8
          Write-Host "::notice::native Windows job on $($os.Caption) build $($os.BuildNumber)"

      - name: unit tests (no Windows-specific tooling needed)
        id: unit
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "continue"
          python tests/unit/run_unit.py *>&1 | Tee-Object -FilePath .sandbox/logs/unit-tests.log
          $code = $LASTEXITCODE
          "unit: exit=$code" | Out-File -FilePath .sandbox/steps.log -Append -Encoding utf8
          $summary = (Select-String -Path .sandbox/logs/unit-tests.log -Pattern "^---- unit" |
                      Select-Object -Last 1).Line
          Write-Host "::notice::unit tests exit=$code | $summary"
          if ($code -ne 0) {
            # The names first, then the tracebacks of the first few failures. The
            # suite's own `error:` lines are expected stderr from tests that
            # assert refusals, so they are deliberately not annotated.
            $names = (Select-String -Path .sandbox/logs/unit-tests.log -Pattern "^=== FAIL (.+)$" |
                      ForEach-Object { $_.Matches[0].Groups[1].Value }) -join ", "
            if ($names.Length -gt 380) { $names = $names.Substring(0, 380) }
            Write-Host "::error::failing tests on Windows: $names"
            $blocks = Select-String -Path .sandbox/logs/unit-tests.log -Pattern "^=== FAIL" -Context 0,13 |
                      Select-Object -First 4
            foreach ($block in $blocks) {
              foreach ($line in (@($block.Line) + $block.Context.PostContext)) {
                $clean = ($line -replace "%", "%25")
                if ($clean.Length -gt 380) { $clean = $clean.Substring(0, 380) }
                Write-Host "::error::$clean"
              }
            }
            $skips = (Select-String -Path .sandbox/logs/unit-tests.log -Pattern "^SKIP ").Count
            Write-Host "::notice::$skips test(s) skipped on Windows (read the SKIP reasons in the artifact log)"
          }
          exit $code

      - name: locate a native MinGW toolchain
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "continue"
          $found = $null
          foreach ($dir in @("C:\msys64\ucrt64\bin", "C:\msys64\mingw64\bin",
                             "C:\mingw64\bin", "C:\ProgramData\mingw64\bin")) {
            if (Test-Path (Join-Path $dir "g++.exe")) { $found = $dir; break }
          }
          if (-not $found) {
            $onPath = Get-Command g++ -ErrorAction SilentlyContinue
            if ($onPath) { $found = Split-Path -Parent $onPath.Source }
          }
          if ($found) {
            Write-Host "MinGW toolchain: $found"
            Write-Host "::notice::MinGW toolchain found at $found"
            $found | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            # awt/builder.py honours these instead of assuming a cross prefix
            "AWT_CXX=g++"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "AWT_CC=gcc"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "AWT_NM=nm"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "AWT_CXXFILT=c++filt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "toolchain: found=$found" | Out-File -FilePath .sandbox/steps.log -Append -Encoding utf8
          } else {
            Write-Host "::warning::no MinGW toolchain found - the run will report build_failed or not_executed, and that is the honest result"
            "toolchain: found=none" | Out-File -FilePath .sandbox/steps.log -Append -Encoding utf8
          }

      - name: what can this machine execute? (backend capabilities)
        id: capabilities
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "continue"
          python -m awt.backends.windows_ci --selftest *>&1 |
            Tee-Object -FilePath .sandbox/logs/selftest.log
          $code = $LASTEXITCODE
          python -m awt.backends --list-json *>&1 |
            Out-File -FilePath .sandbox/backends.json -Encoding utf8
          "capabilities: selftest exit=$code backends.json=$((Test-Path .sandbox/backends.json))" |
            Out-File -FilePath .sandbox/steps.log -Append -Encoding utf8
          if ($code -ne 0) {
            Write-Host "::error::awt.backends.windows_ci --selftest failed with exit code $code"
          } else {
            Write-Host "::notice::backend self-test passed; capabilities written to .sandbox/backends.json"
          }
          exit $code

      - name: build and run the mod natively
        id: runmod
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "continue"
          $mod = "${{ github.event.inputs.mod }}"
          if (-not $mod) { $mod = "examples/hello-log.wh.cpp" }
          $seconds = "${{ github.event.inputs.seconds }}"
          if (-not $seconds) { $seconds = "6" }
          $arguments = @("-m", "awt.backends.windows_ci", "--mod", $mod,
                         "--seconds", $seconds, "--json", ".sandbox/windows-report.json")
          if ("${{ github.event.inputs.screenshot }}" -ne "false") {
            $arguments += "--screenshot"
          }
          Write-Host "python $($arguments -join ' ')"
          python @arguments *>&1 | Tee-Object -FilePath .sandbox/logs/native-run.log
          $code = $LASTEXITCODE
          $produced = Test-Path .sandbox/windows-report.json
          "runmod: exit=$code report=$produced" |
            Out-File -FilePath .sandbox/steps.log -Append -Encoding utf8
          if ($produced) {
            $level = (Get-Content .sandbox/windows-report.json -Raw |
                      ConvertFrom-Json).verdict.level
            Write-Host "::notice::native run finished: exit=$code, verdict.level=$level (the level is the result, not a job status)"
          } else {
            Write-Host "::error::the native run produced no report (exit=$code); the last 10 lines of its log follow"
            Get-Content .sandbox/logs/native-run.log -Tail 10 | ForEach-Object {
              $line = ($_ -replace "%", "%25")
              Write-Host "::error::runmod: $line"
            }
          }
          exit $code

      - name: step summary (honest, including what was NOT verified)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "continue"
          if (Test-Path .sandbox/windows-report.json) {
            python -m awt.backends.windows_ci --summary .sandbox/windows-report.json |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            @('## Native Windows run: no report', '',
              'The harness did not produce a report. The markers below show how far it got.',
              '', '```') |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            if (Test-Path .sandbox/steps.log) {
              Get-Content .sandbox/steps.log |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: fail the job only when the harness broke
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "continue"
          $reportExists = Test-Path .sandbox/windows-report.json
          $failed = $false
          if ("${{ steps.unit.outcome }}" -eq "failure") {
            Write-Host "::error::the unit tests failed on Windows - that is harness breakage, not a mod result"
            $failed = $true
          }
          if ("${{ steps.capabilities.outcome }}" -eq "failure") {
            Write-Host "::error::the backend self-test failed - the harness cannot describe this machine"
            $failed = $true
          }
          if (-not $reportExists) {
            Write-Host "::error::no report was produced at .sandbox/windows-report.json; markers so far:"
            if (Test-Path .sandbox/steps.log) {
              Get-Content .sandbox/steps.log | ForEach-Object {
                Write-Host "::error::marker: $($_ -replace '%', '%25')"
              }
            }
            $failed = $true
          }
          if ($failed) { exit 1 }
          Write-Host "::notice::harness healthy: unit tests passed and a native report was produced"

      - name: upload report, capabilities, screenshot and diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-report
          path: |
            .sandbox/windows-report.json
            .sandbox/backends.json
            .sandbox/steps.log
            .sandbox/logs/unit-tests.log
            .sandbox/logs/selftest.log
            .sandbox/logs/native-run.log
            .sandbox/logs/screenshot-native-*.png
          if-no-files-found: warn
          retention-days: 30
